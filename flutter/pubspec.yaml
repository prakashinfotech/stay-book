name: staybook_app
description: StayBook — Hotel booking app for customers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Navigation
  go_router: ^18.0.1

  # Network
  dio: ^5.4.3

  # Secure storage
  flutter_secure_storage: ^11.2.0

  # Dependency injection
  get_it: ^9.3.0

  # Functional error handling
  dartz: ^0.10.1

  # Code-gen annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Images
  cached_network_image: ^4.0.1
  flutter_cache_manager: ^3.4.0

  # Payment
  razorpay_flutter: ^1.3.6

  # Utilities
  intl: ^0.20.3
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  shimmer: ^4.0.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  freezed: ^4.0.1
  json_serializable: ^6.8.0
  build_runner: ^2.4.9

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
